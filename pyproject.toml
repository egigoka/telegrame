[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegrame"
dynamic = ["version"]
description = "telegrame"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Egor Egorov", email = "egigoka@gmail.com"},
]
dependencies = [
  "pytelegrambotapi",
  "requests",
]

[project.urls]
Homepage = "https://www.github.com/egigoka/telegrame"
Repository = "https://www.github.com/egigoka/telegrame"

[tool.setuptools]
packages = ["telegrame"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "telegrame._version.__version__"}
